spring.datasource.url=${TEST_DATASOURCE_URL}
spring.datasource.username=${TEST_DATASOURCE_USERNAME}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD}
spring.thymeleaf.cache=false
siteplain.data.bootstrapEnabled=false
siteplain.data.refreshOnStartup=false
# Every test shares one client address (MockMvc's 127.0.0.1); RateLimitIntegrationTest turns limits on.
siteplain.limits.rateLimitsEnabled=false
# Integration tests assert on individual client-error WARN lines; GlobalExceptionHandlerTest covers the throttle.
siteplain.logging.clientErrorInterval=0s
