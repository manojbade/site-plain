<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About | Site Plain</title>
  <th:block th:replace="~{fragments/head :: assets}"></th:block>
</head>
<body class="bg-page">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-xl-10">
      <div class="tt-page-intro">
        <h1 class="tt-page-title mb-0">About Site Plain</h1>
      </div>

      <div class="tt-about-grid">
        <section id="methodology">
          <h2 class="tt-section-heading">Methodology</h2>
          <ul class="mb-0">
            <li th:each="point : ${viewModel.methodologyPoints}" th:text="${point}">Methodology point</li>
          </ul>
        </section>

        <section id="limitations">
          <h2 class="tt-section-heading">Limitations</h2>
          <ul class="mb-0">
            <li th:each="point : ${viewModel.limitations}" th:text="${point}">Limitation</li>
          </ul>
        </section>

        <section id="data-sources">
          <h2 class="tt-section-heading">Data sources</h2>
          <ul class="tt-source-list">
            <li th:each="source : ${viewModel.dataSources}" th:text="${source}">Source</li>
          </ul>
        </section>

        <div th:replace="~{fragments/disclaimer :: disclaimer}"></div>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
