<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Generic on purpose: nothing typed is carried to this page, so it cannot echo an address or a crafted message. */-->
<section th:fragment="unresolved" class="tt-surface tt-state-card">
  <p class="eyebrow mb-2">Address not found</p>
  <h1 class="h2 mb-3">Address could not be resolved</h1>
  <p class="tt-muted-copy mb-3">The lookup could not geocode this address well enough to run the site search. Check the street number, street name, city and state, or try a nearby street address.</p>
  <a th:href="@{/}" class="btn tt-btn-primary">Try another address</a>
</section>
</body>
</html>
