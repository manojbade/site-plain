<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${status == 500} ? 'Error | Site Plain' : 'Not Found | Site Plain'">Not Found | Site Plain</title>
  <th:block th:replace="~{fragments/head :: assets}"></th:block>
</head>
<body class="bg-page">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="tt-surface">
        <!--/* Server errors (status 500) and missing pages (404) share this template but not its wording. */-->
        <section class="tt-state-card" th:if="${status == 500}">
          <p class="eyebrow mb-2">Something went wrong</p>
          <h1 class="h2 mb-3">Site Plain could not finish this request</h1>
          <p class="tt-muted-copy mb-4">Try again in a minute. If it keeps happening, use the <a th:href="@{/feedback}">feedback form</a>.</p>
          <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/}" class="btn tt-btn-primary">Go to the homepage</a>
            <a th:href="@{/about}" class="btn tt-btn-secondary">About Site Plain</a>
          </div>
        </section>
        <section class="tt-state-card" th:unless="${status == 500}">
          <p class="eyebrow mb-2">404</p>
          <h1 class="h2 mb-3">Page not found</h1>
          <p class="tt-muted-copy mb-4" th:text="${message != null ? message : 'The requested page could not be found.'}">The requested page could not be found.</p>
          <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/}" class="btn tt-btn-primary">Go to the homepage</a>
            <a th:href="@{/about}" class="btn tt-btn-secondary">About Site Plain</a>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
