spring.application.name=site-plain
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

siteplain.data.bootstrapEnabled=${SITEPLAIN_DATA_BOOTSTRAP_ENABLED:true}
siteplain.data.refreshOnStartup=${SITEPLAIN_DATA_REFRESH_ON_STARTUP:false}
siteplain.data.maxAgeDays=${SITEPLAIN_DATA_MAX_AGE_DAYS:}
siteplain.data.nplBoundariesUrl=${SITEPLAIN_DATA_NPL_BOUNDARIES_URL:}
siteplain.data.humanExposureUrl=${SITEPLAIN_DATA_HUMAN_EXPOSURE_URL:https://www3.epa.gov/semsjson/Human_Exposure_Site_List.json}
siteplain.data.boundariesDownloadTimeout=${SITEPLAIN_DATA_BOUNDARIES_DOWNLOAD_TIMEOUT:300s}
siteplain.data.boundariesMaxSize=${SITEPLAIN_DATA_BOUNDARIES_MAX_SIZE:240MB}
siteplain.data.humanExposureDownloadTimeout=${SITEPLAIN_DATA_HUMAN_EXPOSURE_DOWNLOAD_TIMEOUT:60s}
siteplain.data.humanExposureMaxSize=${SITEPLAIN_DATA_HUMAN_EXPOSURE_MAX_SIZE:6MB}
# Spring cron in UTC (sec min hour day month weekday); "-" turns the scheduled refresh off.
siteplain.data.scheduledRefreshCron=${SITEPLAIN_DATA_SCHEDULED_REFRESH_CRON:0 30 8 * * *}

siteplain.geocoder.userAgent=${SITEPLAIN_GEOCODER_USER_AGENT:site-plain/0.0.1}
siteplain.site.baseUrl=${SITEPLAIN_BASE_URL:https://site-plain.com}

spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

management.endpoints.web.exposure.include=health
# /actuator/health/liveness and /actuator/health/readiness. Readiness turns UP only after the startup
# data refresh returns (Spring Boot sets ACCEPTING_TRAFFIC after the ApplicationRunners), so it is the
# path for the Railway healthcheck. /actuator/health itself is unchanged.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.status.order=down,out-of-service,up,unknown
# The probes add readinessState to /actuator/health too. Ranking UP above OUT_OF_SERVICE there keeps
# it as before: UP while the startup refresh runs, DOWN only when a check is DOWN.
management.endpoint.health.status.order=down,up,out-of-service,unknown
